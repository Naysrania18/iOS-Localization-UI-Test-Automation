# XcodeGen spec: generates iOSLocalizationUITestAutomation.xcodeproj (run `xcodegen generate`).
# Install XcodeGen with: brew install xcodegen
name: iOSLocalizationUITestAutomation
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
targets:
  iOSLocalizationUITestAutomation:
    type: application
    platform: iOS
    sources:
      - iOSLocalizationUITestAutomation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iOSLocalizationUITestAutomation
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  iOSLocalizationUITestAutomationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - iOSLocalizationUITestAutomationUITests
    dependencies:
      - target: iOSLocalizationUITestAutomation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iOSLocalizationUITestAutomationUITests
        TEST_TARGET_NAME: iOSLocalizationUITestAutomation
schemes:
  iOSLocalizationUITestAutomation:
    build:
      targets:
        iOSLocalizationUITestAutomation: all
    test:
      targets:
        - iOSLocalizationUITestAutomationUITests
